services:
  app:
    working_dir: /${APP_DIR}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/${APP_DIR}:cached
      - ~/.ssh:/root/.ssh:ro
      - ${ZSHRC_PATH:-${HOME}/.zshrc}:/root/.zshrc:ro
      - ${NEOVIM_CONFIG_PATH:-${HOME}/.config/nvim}:/root/.config/nvim
      - ${GITCONFIG_PATH:-${HOME}/.gitconfig}:/root/.gitconfig:ro
      - ${CODEX_PATH:-/dev/null}:/root/.codex
      - nvim-data:/root/.local/share/nvim
      - nvim-state:/root/.local/state/nvim
      - nvim-cache:/root/.cache/nvim
    stdin_open: true
    tty: true
    command: zsh
    env_file:
      - .env
    networks:
      - devnet
      - shared-postgres-network
volumes:
  nvim-data:
  nvim-state:
  nvim-cache:

networks:
  devnet:
    driver: bridge
  shared-postgres-network:
    external: true
